{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Acesso — ADECIN Nova Jerusalém{% endblock %}</title>
        <link rel="icon" href="{% static 'imagem/logo/logo-simbolo-verde.png' %}">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=EB+Garamond:wght@400;500;600&family=Kaushan+Script&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'styles/styles.css' %}">
    </head>
    <body>

        {% include 'usuario/header.html' %}

        {% for message in messages %}
            <p class="alerta" id="messages">{{ message }}</p>
        {% endfor %}

        {% block conteudo %}{% endblock %}

    </body>
</html>
